# Everything runs offline: the tests build their own FAISS stores with fake embeddings.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catches breakage from new langchain-community / faiss releases
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv pip list | grep -iE "langchain|faiss|numpy|pydantic"
      - run: uv run --python ${{ matrix.python }} pytest -q
      - run: uv run --python ${{ matrix.python }} faiss-defuse demo --out "$RUNNER_TEMP/faiss-defuse-demo"
      - run: uv build
