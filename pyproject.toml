[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "faiss-defuse"
version = "0.1.0"
description = "Inspect, convert and load LangChain FAISS stores without executing pickle: static scan, pickle-free format, flag-free loader."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["faiss", "langchain", "pickle", "security", "rag", "deserialization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langchain = [
  "langchain-community>=0.4.2,<0.5",
  "langchain-core>=1.8.4,<2",
  "faiss-cpu>=1.16.0,<2",
  "numpy>=1.26",
]

[project.scripts]
faiss-defuse = "faiss_defuse.cli:main"

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/faiss-defuse"
Issues = "https://github.com/LeeGyeongPil/faiss-defuse/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "langchain-community>=0.4.2,<0.5",
  "langchain-core>=1.8.4,<2",
  "faiss-cpu>=1.16.0,<2",
  "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faiss_defuse"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "README.ko.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
